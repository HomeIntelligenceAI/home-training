# HFM-2 reference configuration. Architecture fixed by decision D4:
# vocab 32,768 (matching home-tokenizer), context 1024, 138.5M parameters.
#
# Blocked only on data. R0 in the roadmap exists to measure how many quality
# Telugu tokens are actually obtainable; this model wants ~2.8B to be
# compute-optimal.
#
# MEASURED on the reference device (RTX 3050 A Laptop, 4.29 GB, sm_89,
# torch 2.13.0+cu130, bf16 autocast). Median of 8 timed steps after warmup:
#
#   config                  peak VRAM   tok/s   2.8B tokens
#   bs1 + checkpointing        2.35 GB   2,253      14.4 d
#   bs2 + checkpointing        2.63 GB   4,784       6.8 d   <-- chosen
#   bs1, no checkpointing      2.96 GB   4,138       7.8 d
#
# An earlier version of this file estimated ~2.9 GB and claimed batch_size 1
# with checkpointing was the only thing that fits. Both parts were wrong: the
# real peak at bs1 is 2.35 GB, and bs2 is both faster and still well inside
# the card.
#
# WARNING -- anything whose peak exceeds 4.29 GB does NOT raise OutOfMemory.
# It silently spills to host RAM and keeps running at a fraction of the speed.
# Measured without checkpointing: bs2 -> 516 tok/s, bs4 -> 369, bs6 -> 149.
# That is 9-32x slower while looking like it works. If throughput drops off a
# cliff after a config change, check peak VRAM before anything else.
# The real corpus, NOT repos/corpus/tokens -- that is the 651K-token demo
# stream built with vocab 8,192, and pointing a 32,768-vocab model at it
# trains 75% of the embedding on nothing while raising no error.
train_bin: C:/HomeAI_Corpus/tokens/train.bin
val_bin: C:/HomeAI_Corpus/tokens/val.bin
out_dir: C:/HomeAI_Corpus/checkpoints-138m

batch_size: 2
grad_accum_steps: 16          # effective batch 32 x 1024 = 32,768 tokens/step
# 25,000 steps x 32,768 tokens = 819M tokens = 2.9 epochs over the current
# 280M-token corpus. Past roughly 3 epochs a 138M model starts memorising
# rather than learning. Reaching compute-optimal 2.77B needs the remaining
# ~1.58M FineWeb documents downloaded first -- then raise this to ~85,000.
max_steps: 25000
warmup_steps: 500
lr: 0.0003
min_lr_ratio: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

eval_interval: 1000
eval_batches: 50
checkpoint_interval: 500      # measured 6.8s/step, so ~1 hour between saves
log_interval: 50

gradient_checkpointing: true  # measured faster AND smaller than bs1 without it
# dtype: null -> bfloat16 here (sm_89 supports it natively, so no GradScaler)

model:
  vocab_size: 32768
  dim: 768
  n_layers: 12
  n_heads: 12
  # n_kv_heads: 4  # enable GQA to cut the KV cache 3x during generation
  hidden_dim: 3072
  max_seq_len: 1024
  dropout: 0.0
