model:
  vocab_size: 50000
  dim: 768
  num_layers: 12
  num_heads: 12
  hidden_dim: 3072
  dropout: 0.0

data:
  batch_size: 4
  seq_len: 512

optimizer:
  lr: 5.0e-4
  weight_decay: 0.01

scheduler:
  t_max: 100000

training:
  epochs: 5
  max_grad_norm: 1.0

log_dir: "runs"
checkpoint_dir: "checkpoints"
